<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">AuraTrust Sentinel system architecture</title>
  <desc id="desc">Architecture diagram showing the React frontend and scanner connecting to a FastAPI gateway, authentication, biometric verification, risk decisioning, persistence, audit reporting and realtime WebSocket services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="1" stop-color="#102746"/>
    </linearGradient>
    <linearGradient id="gateway" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f75d2"/>
      <stop offset="1" stop-color="#25c4d7"/>
    </linearGradient>
    <linearGradient id="biometric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#694bd1"/>
      <stop offset="1" stop-color="#a56bdf"/>
    </linearGradient>
    <linearGradient id="decision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5841c"/>
      <stop offset="1" stop-color="#f2ba43"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#118b70"/>
      <stop offset="1" stop-color="#43c995"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5ad8e2"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f2ba43"/>
    </marker>
    <style>
      .label{font-family:Arial,Helvetica,sans-serif;fill:#f4f8ff}
      .muted{font-family:Arial,Helvetica,sans-serif;fill:#a4b5cd}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#c6d4e8;font-size:17px}
      .node{filter:url(#shadow)}
      .line{fill:none;stroke:#5ad8e2;stroke-width:4;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#f2ba43;stroke-width:4;stroke-dasharray:12 10;marker-end:url(#arrowAmber)}
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1440" cy="120" r="210" fill="#1c6fc0" opacity=".12"/>
  <circle cx="120" cy="870" r="260" fill="#25c4d7" opacity=".08"/>

  <text x="80" y="74" class="label" font-size="38" font-weight="700">AURATRUST SENTINEL</text>
  <text x="80" y="116" class="muted" font-size="22">Zero-Trust AI Attendance Platform — System Architecture</text>
  <text x="80" y="154" class="muted" font-size="16">REST + WebSocket edge connectivity • server-side biometric identity • risk-aware two-phase attendance</text>

  <!-- Client layer -->
  <text x="80" y="220" class="muted" font-size="18" font-weight="700" letter-spacing="2">CLIENT / EDGE LAYER</text>
  <g class="node">
    <rect x="80" y="250" width="260" height="125" rx="18" fill="#172f59" stroke="#3c79bd" stroke-width="2"/>
    <text x="110" y="291" class="label" font-size="25" font-weight="700">React Frontend</text>
    <text x="110" y="324" class="small">Landing • Faculty • Student</text>
    <text x="110" y="351" class="small">Reports • Tailwind • Three.js</text>
  </g>
  <g class="node">
    <rect x="80" y="415" width="260" height="125" rx="18" fill="#172f59" stroke="#3c79bd" stroke-width="2"/>
    <text x="110" y="456" class="label" font-size="25" font-weight="700">Scanner Kiosk</text>
    <text x="110" y="489" class="small">Camera capture + upload</text>
    <text x="110" y="516" class="small">Browser WebSocket client</text>
  </g>

  <!-- Gateway -->
  <text x="440" y="220" class="muted" font-size="18" font-weight="700" letter-spacing="2">APPLICATION GATEWAY</text>
  <g class="node">
    <rect x="440" y="265" width="310" height="245" rx="22" fill="url(#gateway)" stroke="#8ceaf0" stroke-width="2"/>
    <text x="480" y="318" class="label" font-size="32" font-weight="700">FastAPI Monolith</text>
    <text x="480" y="356" class="small">REST API • Uvicorn • CORS</text>
    <text x="480" y="386" class="small">Request IDs • security headers</text>
    <text x="480" y="416" class="small">JWT / RBAC authentication</text>
    <text x="480" y="446" class="small">47 loaded routes</text>
    <text x="480" y="482" class="small">/api/v1 + /docs + /metrics</text>
  </g>

  <!-- Processing -->
  <text x="850" y="220" class="muted" font-size="18" font-weight="700" letter-spacing="2">TRUST DECISION PIPELINE</text>
  <g class="node">
    <rect x="850" y="250" width="290" height="125" rx="18" fill="url(#biometric)" stroke="#d8b5f5" stroke-width="2"/>
    <text x="885" y="291" class="label" font-size="25" font-weight="700">Biometric Pipeline</text>
    <text x="885" y="324" class="small">SCRFD / landmarks / PnP</text>
    <text x="885" y="351" class="small">ArcFace 512-D embeddings</text>
  </g>
  <g class="node">
    <rect x="850" y="415" width="290" height="125" rx="18" fill="url(#biometric)" stroke="#d8b5f5" stroke-width="2"/>
    <text x="885" y="456" class="label" font-size="25" font-weight="700">Anti-Spoofing</text>
    <text x="885" y="489" class="small">FFT frequency analysis</text>
    <text x="885" y="516" class="small">Texture + liveness scoring</text>
  </g>
  <g class="node">
    <rect x="850" y="580" width="290" height="125" rx="18" fill="url(#decision)" stroke="#ffe0a0" stroke-width="2"/>
    <text x="885" y="621" class="label" font-size="25" font-weight="700">Risk Engine</text>
    <text x="885" y="654" class="small">Similarity + behavior signals</text>
    <text x="885" y="681" class="small">ALLOW • FLAG • DENY</text>
  </g>

  <!-- Persistence and operations -->
  <text x="1240" y="220" class="muted" font-size="18" font-weight="700" letter-spacing="2">DATA / OPERATIONS</text>
  <g class="node">
    <rect x="1240" y="250" width="280" height="125" rx="18" fill="url(#data)" stroke="#a3f4d3" stroke-width="2"/>
    <text x="1275" y="291" class="label" font-size="25" font-weight="700">MySQL + SQLAlchemy</text>
    <text x="1275" y="324" class="small">Sessions • staging • ledger</text>
    <text x="1275" y="351" class="small">Enrollments • faculty review</text>
  </g>
  <g class="node">
    <rect x="1240" y="415" width="280" height="125" rx="18" fill="#155b68" stroke="#7aeaf1" stroke-width="2"/>
    <text x="1275" y="456" class="label" font-size="25" font-weight="700">Realtime Hub</text>
    <text x="1275" y="489" class="small">Session channels + heartbeat</text>
    <text x="1275" y="516" class="small">Live faculty dashboard events</text>
  </g>
  <g class="node">
    <rect x="1240" y="580" width="280" height="125" rx="18" fill="#155b68" stroke="#7aeaf1" stroke-width="2"/>
    <text x="1275" y="621" class="label" font-size="25" font-weight="700">Audit + Metrics</text>
    <text x="1275" y="654" class="small">SHA-256 JSONL audit trail</text>
    <text x="1275" y="681" class="small">Health + Prometheus metrics</text>
  </g>

  <!-- Main flow arrows -->
  <path d="M340 312 C380 312 395 330 440 330" class="line"/>
  <path d="M340 477 C385 477 400 445 440 445" class="line"/>
  <path d="M750 330 C795 330 805 312 850 312" class="line"/>
  <path d="M750 420 C800 420 805 477 850 477" class="line"/>
  <path d="M995 375 L995 415" class="line"/>
  <path d="M995 540 L995 580" class="line"/>
  <path d="M1140 312 C1180 312 1190 312 1240 312" class="line"/>
  <path d="M1140 477 C1180 477 1190 477 1240 477" class="line"/>
  <path d="M1140 642 C1180 642 1190 642 1240 642" class="line"/>

  <!-- Decision branches -->
  <rect x="510" y="770" width="250" height="92" rx="16" fill="#123f37" stroke="#43c995" stroke-width="2"/>
  <text x="545" y="808" class="label" font-size="22" font-weight="700">AUTO APPROVE</text>
  <text x="545" y="838" class="small">Risk below threshold → staging</text>
  <rect x="850" y="770" width="300" height="92" rx="16" fill="#563b18" stroke="#f2ba43" stroke-width="2"/>
  <text x="885" y="808" class="label" font-size="22" font-weight="700">DUAL VERIFICATION</text>
  <text x="885" y="838" class="small">Risk flag → faculty review queue</text>
  <path d="M930 705 C850 735 750 755 700 770" class="dashed"/>
  <path d="M1060 705 L1010 770" class="dashed"/>
  <path d="M760 816 C900 900 1080 900 1240 650" class="dashed"/>

  <!-- Legend / footer -->
  <line x1="80" y1="910" x2="1520" y2="910" stroke="#29496f" stroke-width="2"/>
  <circle cx="100" cy="942" r="7" fill="#5ad8e2"/>
  <text x="120" y="949" class="muted" font-size="16">REST / processing flow</text>
  <circle cx="390" cy="942" r="7" fill="#f2ba43"/>
  <text x="410" y="949" class="muted" font-size="16">Risk decision / human review</text>
  <text x="1520" y="949" text-anchor="end" class="muted" font-size="16">AuraTrust Sentinel • Architecture v1.0</text>
</svg>
